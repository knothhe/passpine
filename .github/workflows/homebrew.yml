name: Sync Homebrew

on:
  workflow_call:
    inputs:
      tag:
        description: Published stable release tag to synchronize
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to synchronize, for example v0.1.10
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Update knothhe/tap
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap-passpine-main
      cancel-in-progress: false
      # Keep pending release updates instead of replacing the previous pending job.
      queue: max
    steps:
      - name: Check out the synchronization script
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
          persist-credentials: false
      - name: Check out the public Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: knothhe/homebrew-tap
          ref: main
          path: tap
          fetch-depth: 0
          # A dedicated deploy key can write only to homebrew-tap.
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the published package and update the public tap
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node source/scripts/sync-homebrew.mjs --publish "$RELEASE_TAG" --tap-root "$GITHUB_WORKSPACE/tap"
