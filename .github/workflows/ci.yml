name: CI

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to check out and package
        required: true
        type: string
    secrets:
      PASSPINE_MACOS_SIGNING_CERTIFICATE:
        required: false
      PASSPINE_MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  build:
    name: Check and build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: windows-amd64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PASSPINE_BUILD_CHANNEL: release
      CGO_ENABLED: '1'
      # Public trust anchor is compiled into each client. The signing key is
      # available only to the separate publication job.
      PASSPINE_UPDATE_PUBLIC_KEY: ${{ vars.PASSPINE_UPDATE_PUBLIC_KEY }}
      PASSPINE_UPDATE_FEED_URL: ${{ vars.PASSPINE_UPDATE_FEED_URL }}
    steps:
      - name: Check out sources and release history
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up the pinned pnpm version
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: browser/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: client/go.mod
          cache-dependency-path: |
            client/go.sum
            scripts/windows-resources/go.sum

      - name: Verify release tag and package versions
        if: inputs.tag != ''
        run: node scripts/ci-release.mjs verify "$RELEASE_TAG"

      - name: Install Linux runtime and archive tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-0 fonts-noto-cjk zip unzip 7zip nsis xvfb xauth

      - name: Install Windows packaging and test tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nsis --yes --no-progress --execution-timeout=300
          $gnupgPackage = Join-Path $env:RUNNER_TEMP 'gnupg.2.5.21.nupkg'
          $gnupgPackageDir = Join-Path $env:RUNNER_TEMP 'gnupg-package-2.5.21'
          $gnupgRoot = Join-Path $env:RUNNER_TEMP 'gnupg-2.5.21'
          Invoke-WebRequest -Uri 'https://community.chocolatey.org/api/v2/package/gnupg/2.5.21' -OutFile $gnupgPackage -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $gnupgPackage -Algorithm SHA256).Hash -ne '42D65C86D0FCF4501337D45279CCE055EF172A158327AABA763D15A3C42866B6') {
            throw 'The pinned GnuPG package checksum does not match.'
          }
          7z x $gnupgPackage "-o$gnupgPackageDir" -y
          $gnupgInstaller = Join-Path $gnupgPackageDir 'tools\gnupg-w32-2.5.21_20260702.exe'
          if ((Get-FileHash -LiteralPath $gnupgInstaller -Algorithm SHA256).Hash -ne '6246C925A73167253444AFC24A0DEB83A3F43B7D636AF84D6AAF48A98A62F024') {
            throw 'The upstream GnuPG installer checksum does not match.'
          }
          # Extract the complete native runtime without invoking the NSIS installer.
          # Keep normal GNUPGHOME handling by leaving gpgconf.ctl absent.
          7z x $gnupgInstaller "-o$gnupgRoot" -y 'bin/*' 'share/*' 'README.txt'
          $gnupgBin = Join-Path $gnupgRoot 'bin'
          foreach ($file in @('gpg.exe', 'gpgconf.exe', 'gpg-agent.exe', 'keyboxd.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $gnupgBin $file) -PathType Leaf)) {
              throw "The extracted GnuPG runtime is missing $file."
            }
          }
          # The MSYS GnuPG bundled with Git rejects native Windows fixture paths.
          $gnupgBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$gnupgBin;$env:PATH"
          foreach ($tool in @('gpg', 'gpgconf')) {
            $command = Get-Command "$tool.exe" -CommandType Application | Select-Object -First 1
            if ((Split-Path -Path $command.Source -Parent) -ne $gnupgBin) {
              throw "Expected native Windows $tool from $gnupgBin, found $($command.Source)."
            }
            Write-Host "$tool executable: $($command.Source)"
            & $command.Source --version
          }
          gcc --version
          make --version

      - name: Install browser dependencies
        run: pnpm --dir browser install --frozen-lockfile

      - name: Check macOS and Linux sources
        if: runner.os != 'Windows'
        run: bash scripts/check.sh

      - name: Check Windows sources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/version.mjs check
          node scripts/dependencies.mjs --check
          pnpm run test:tooling
          Push-Location scripts/windows-resources
          try { go test ./... } finally { Pop-Location }
          Push-Location client
          try {
            $env:PASSPINE_TEST_HOST = Join-Path $env:RUNNER_TEMP 'passpine-host-test.exe'
            go build -o $env:PASSPINE_TEST_HOST ./cmd/passpine-host
            go test -race ./...
            go vet ./...
          } finally {
            Remove-Item Env:PASSPINE_TEST_HOST -ErrorAction SilentlyContinue
            Pop-Location
          }
          pnpm --dir browser run typecheck
          pnpm --dir browser test

      - name: Build signed macOS client package
        if: runner.os == 'macOS'
        env:
          # A temporary keychain holds the stable identity only during this build.
          PASSPINE_MACOS_SIGNING_CERTIFICATE: ${{ secrets.PASSPINE_MACOS_SIGNING_CERTIFICATE }}
          PASSPINE_MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.PASSPINE_MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: node scripts/macos-signing.mjs build

      - name: Build Linux client package
        if: runner.os == 'Linux'
        run: bash scripts/build-client.sh

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-client.ps1

      - name: Verify isolated Windows installer extraction
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-installer-update.ps1

      - name: Verify isolated Linux Dev install and uninstall
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum env PASSPINE_NATIVE_SMOKE=1 go -C client test -run '^TestNativePreviewStartup$' ./cmd/passpine
          xvfb-run --auto-servernum node scripts/verify-dev-installation.mjs --run

      - name: Verify isolated macOS and Windows Dev install and uninstall
        if: runner.os != 'Linux'
        run: node scripts/verify-dev-installation.mjs --run

      - name: Upload client build
        if: inputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.target }}
          path: dist/Passpine-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Stage client release package
        if: inputs.tag != ''
        run: node scripts/ci-release.mjs stage-client "$RELEASE_TAG"

      - name: Upload client release package and provenance
        if: inputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-client-${{ matrix.target }}
          path: |
            dist/releases/*/Passpine-*
            dist/releases/*/manifest-client-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Build Chrome and Firefox packages
        if: runner.os == 'Linux'
        run: pnpm --dir browser run zip

      - name: Upload browser build
        if: runner.os == 'Linux' && inputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: browser
          path: browser/.output/passpine-*.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Stage browser release packages
        if: runner.os == 'Linux' && inputs.tag != ''
        run: node scripts/ci-release.mjs stage-browser "$RELEASE_TAG"

      - name: Upload browser release packages and provenance
        if: runner.os == 'Linux' && inputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-browser
          path: |
            dist/releases/*/passpine-*.zip
            dist/releases/*/manifest-browser.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
