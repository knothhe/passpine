<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passpine Neo 设计</title><link rel="stylesheet" href="review.css"><div style="width:720px;padding:32px"><h2>快捷键</h2><p>全局搜索快捷键</p><div class="search" style="margin:0;display:flex;align-items:center"><span class="grow">Ctrl + Alt + Space</span><button>录制快捷键</button><button>恢复默认</button></div><p class="note">按下组合键后生效。组合键冲突时保留原有快捷键并显示提示。</p><h3>浏览器快捷键</h3><p>打开 Passpine Neo <span class="tag">Ctrl + Shift + L</span></p><p>填充匹配账号 <span class="tag">Ctrl + Shift + F</span></p><button class="primary">自定义快捷键</button><p class="note">显示浏览器实际绑定。Chrome 和 Edge 在浏览器快捷键设置中修改，Firefox 可直接录制并保存。</p></div></html>
