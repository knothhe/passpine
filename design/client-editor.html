<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passpine · 居中编辑条目</title>
<script>
const params = new URLSearchParams(location.search);
document.documentElement.dataset.sidebar = params.get('sidebar') === 'expanded' ? 'expanded' : 'collapsed';
document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light';
</script>
<style>
:root{color-scheme:light;--bg:#f2f2f5;--surface:#fff;--input:#f8f8fa;--border:#e3e3e8;--fg:#1c1c21;--muted:#63636b;--on-primary:#fff;font:12px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#2b2c30;--surface:#25262c;--input:#212227;--border:#404145;--fg:#ededf1;--muted:#a1a1aa;--on-primary:#1c1c21}
*{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--bg)}button,input{font:inherit;color:inherit}button{border:0;border-radius:6px;background:transparent;padding:7px 12px;white-space:nowrap}button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.window{display:flex;height:100vh;min-height:620px}.sidebar{display:none;width:380px;flex:none;background:var(--surface);padding:64px 16px 16px}.sidebar input{margin-bottom:14px}.entry{padding:14px 8px;border-radius:7px;background:var(--input)}.entry small{display:block;margin-top:4px;color:var(--muted)}:root[data-sidebar=expanded] .sidebar{display:block}.main{display:flex;flex:1;min-width:0;flex-direction:column}.header{height:48px;display:flex;align-items:center;gap:8px;padding:8px 16px;flex:none}.header .icon{width:28px;height:28px;padding:6px}.grow{flex:1;min-width:0}.vault{border:1px solid var(--border);min-width:170px}.editor{width:100%;max-width:808px;align-self:center;flex:1;min-height:0;padding:24px;display:flex;flex-direction:column;gap:16px}.heading{display:flex;align-items:flex-start}.heading h1{font-size:22px;margin:0 0 5px;font-weight:700}.heading p{font-size:11px;margin:0;color:var(--muted)}.close{padding:7px}.fields{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field>span,.caption{font-size:12px;color:var(--muted)}input,.select{display:block;width:100%;height:34px;min-width:0;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--input)}.select{display:flex;align-items:center;justify-content:space-between}.password-row{display:flex;align-items:flex-end;gap:8px}.password-row>.field{flex:1;min-width:0}.password-row>button{height:34px;padding:8px}.custom{display:flex;flex-direction:column;gap:8px}.custom button{align-self:center}.status{height:16px;flex:none}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;flex:none}.primary{background:var(--fg);color:var(--on-primary)}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="forward" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="sidebar" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="sparkles" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4m-2-2h4"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
</defs></svg>
<div class="window">
<aside class="sidebar"><input aria-label="搜索条目" placeholder="搜索条目"><div class="entry">GitHub<small>开发/GitHub</small></div></aside>
<main class="main">
<header class="header"><button class="icon" aria-label="后退"><svg><use href="#back"/></svg></button><button class="icon" aria-label="前进"><svg><use href="#forward"/></svg></button><button class="icon" aria-label="切换侧栏"><svg><use href="#sidebar"/></svg></button><strong>密码库</strong><span class="grow"></span><button class="vault">个人密码库</button><button class="icon" aria-label="锁定密码库"><svg><use href="#lock"/></svg></button></header>
<section class="editor" aria-label="编辑条目">
<div class="heading"><div class="grow"><h1>编辑条目</h1><p>开发/GitHub</p></div><button class="close" aria-label="关闭编辑器"><svg><use href="#close"/></svg></button></div>
<div class="fields">
<label class="field"><span>名称</span><input aria-label="账号名称" value="GitHub"></label>
<div class="field"><span>文件夹</span><button class="select" aria-label="选择文件夹">开发<span aria-hidden="true">⌄</span></button></div>
<div class="password-row"><label class="field"><span>密码</span><input type="password" value="fake-Secret-42!"></label><button aria-label="显示或隐藏编辑密码"><svg><use href="#eye"/></svg></button><button aria-label="生成并填入密码"><svg><use href="#sparkles"/></svg></button></div>
<label class="field"><span>用户名</span><input value="pine@example.test"></label>
<label class="field"><span>网址</span><input value="https://github.com"></label>
<div class="custom"><span class="caption">自定义字段</span><button>添加字段</button></div>
</div>
<div class="status"></div>
<footer class="actions"><button>原文模式</button><button>保存草稿</button><span class="grow"></span><button>取消</button><button class="primary">保存</button></footer>
</section>
</main>
</div>
</body>
</html>
