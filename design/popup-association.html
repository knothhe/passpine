<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Passpine · 填充与网站关联</title>
  <link rel="stylesheet" href="popup-association.css">
</head>
<body>
  <div class="popup" id="popup"></div>
  <script>
    const paths = {
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4 5 4 13 0 18M12 3c-4 5-4 13 0 18"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',
      user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',
      key: '<circle cx="8" cy="8" r="5"/><path d="m11.5 11.5 9 9M16 16l3-3M18 18l3-3"/>',
      right: '<path d="m9 5 7 7-7 7"/>',
      left: '<path d="m15 5-7 7 7 7"/>',
      more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      fill: '<path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/>',
      pencil: '<path d="m15 5 4 4M4 20l5-1L20 8a3 3 0 0 0-4-4L5 15z"/>',
      trash: '<path d="M3 6h18M8 6V3h8v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/>',
      copy: '<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',
      eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
      link: '<path d="m10 13 4-4M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M16 8l2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(1 0) scale(.9)"/>',
      unlink: '<path d="m9 15-3 3a4 4 0 0 1-6-6l3-3m12 0 3-3a4 4 0 0 1 6 6l-3 3M3 3l18 18M9 3v3M3 9h3m12 3h3m-6 6v3" transform="translate(1 0) scale(.9)"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      warning: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>',
      close: '<path d="m6 6 12 12M6 18 18 6"/>',
      refresh: '<path d="M21 3v6h-6M3 21v-6h6M4 9a8 8 0 0 1 13-5l4 5M3 15l4 5a8 8 0 0 0 13-5"/>',
      lock: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
      settings: '<path d="M4 6h16M4 18h16"/><circle cx="9" cy="6" r="3" fill="currentColor"/><circle cx="15" cy="18" r="3" fill="currentColor"/>'
    };
    const icon = (name, size = 16) => `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`;
    const action = (name, label, extra = '') => `<button class="icon-button" aria-label="${label}" title="${label}" ${extra}>${icon(name)}</button>`;
    const requestedState = new URLSearchParams(location.search).get('state') || 'unlinked';
    const states = ['unlinked', 'filled', 'detail-linked', 'cancelled', 'association-failed', 'filling'];
    const state = states.includes(requestedState) ? requestedState : 'unlinked';
    const linked = ['filled', 'detail-linked'].includes(state);
    const details = ['detail-linked', 'cancelled'].includes(state);
    const busy = state === 'filling';
    const disabled = busy ? 'disabled' : '';
    const badge = '<span class="badge">当前网站</span>';
    const footer = `<footer class="footer"><div class="connection"><span class="dot"></span><span>个人密码库</span><span class="connection-state">已连接</span></div><div class="footer-actions">${action('refresh', '刷新密码库')}${action('lock', '锁定密码库')}${action('settings', '设置与连接')}</div></footer>`;
    const row = (title, folder, first = false) => `<div class="entry ${first && linked ? 'selected' : ''}"><button class="entry-open" title="填充 ${title}" ${disabled}><span class="entry-path">${folder}${first && linked ? badge : ''}</span><strong>${title}</strong></button><div class="entry-actions">${action('user', `复制用户名 ${title}`, disabled)}${action('key', `复制密码 ${title}`, disabled)}${action('right', `查看 ${title}`, disabled)}${action('more', `更多操作 ${title}`, first && ['filled', 'association-failed'].includes(state) ? 'aria-expanded="true"' : disabled)}</div></div>`;
    const list = `<main class="list-page"><div class="site">${icon('globe')}<strong class="grow">github.com</strong>${action('plus', '新建账号', disabled)}<small>${linked ? '1 个关联账号' : '尚无关联账号'}</small></div><div class="search">${icon('search', 18)}<span class="grow">搜索账号</span><kbd>⌘ K</kbd></div><div class="toolbar"><span class="grow">全部账号</span><span>6 个账号</span></div><section class="entries" aria-label="账号">${row('个人账号', '个人', true)}${row('工作账号', '工作')}${row('Studio', '工作')}${row('我的工作空间', '个人')}${row('个人项目', '个人')}${row('Design team', '工作')}</section>${['filled', 'association-failed'].includes(state) ? `<div class="menu"><small>github.com</small><button>${icon(linked ? 'unlink' : 'link', 14)}${linked ? '取消关联当前网站' : '关联到当前网站'}</button></div>` : ''}</main>`;
    const detail = `<main class="detail-page"><header class="detail-header">${action('left', '返回密码库')}<strong class="grow">账号详情</strong>${action('fill', '填充账号')}${action('pencil', '编辑账号')}${action('trash', '删除账号')}</header><div class="detail-body"><div class="summary"><small>个人</small><strong>个人账号</strong></div><div class="field"><div class="grow"><small>用户名</small><span>alex@example.test</span></div>${action('copy', '复制用户名')}</div><div class="field"><div class="grow"><small>密码</small><span class="secret">••••••••••••••••</span></div>${action('eye', '显示密码')}${action('copy', '复制密码')}</div><div class="field"><div class="grow"><small>网站</small><span>${linked ? 'https://github.com' : '尚未设置网站'}</span></div>${linked ? `<span class="accent">${icon('check', 15)}</span>` : ''}</div><button class="association">${icon(linked ? 'unlink' : 'link', 14)}<span>${linked ? '取消关联当前网站' : '关联到 github.com'}</span></button></div></main>`;
    let message = '';
    if (state === 'cancelled') message = '已取消关联 github.com';
    if (state === 'association-failed') message = '已填写 2 个登录字段，但未能关联 github.com，请重试。';
    if (busy) message = '正在填充…';
    const notice = message ? `<div class="notice ${state === 'association-failed' ? 'notice-error' : ''}" role="${state === 'association-failed' ? 'alert' : 'status'}">${icon(state === 'association-failed' ? 'warning' : busy ? 'fill' : 'check')}<span class="grow">${message}</span>${action('close', '关闭提示')}</div>` : '';
    document.getElementById('popup').innerHTML = `${details ? detail : list}${notice}${footer}`;
  </script>
</body>
</html>
